name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rust:
    name: Rust Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Validate flake
        run: nix flake check

      - name: Format
        run: nix develop -c cargo fmt --all --check

      - name: Lint shell scripts
        run: nix develop -c ./scripts/lint-shell.sh

      - name: Clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: nix develop -c cargo test --workspace

      - name: Build release CLI
        run: nix develop -c cargo build -p flutterdec-cli --release

      - name: Release layout smoke
        run: nix develop -c ./scripts/release-layout-smoke.sh target/release/flutterdec

  windows:
    name: Windows CLI build and release smoke
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Windows CLI
        run: cargo build -p flutterdec-cli --locked --release --target x86_64-pc-windows-msvc
      - name: Package and test Windows ZIP
        shell: pwsh
        run: |
          ./scripts/package-windows-release.ps1 -Binary 'target/x86_64-pc-windows-msvc/release/flutterdec.exe' -Archive 'dist/flutterdec-windows-ci.zip'
          ./scripts/windows-release-smoke.ps1 -Archive 'dist/flutterdec-windows-ci.zip'
